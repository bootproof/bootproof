name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run (no actual publish)"
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Inspect tarball (dry-run)
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        if: github.event_name == 'push' || inputs.dry-run != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "Dry-run mode — running npm publish --dry-run --provenance"
            npm publish --dry-run --provenance
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
